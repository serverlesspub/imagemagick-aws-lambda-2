name: Deploy Lambda Layer
permissions:
  contents: write
  pull-requests: write
  id-token: write

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment'
        required: true
        default: 'dev'
      reason:
        description: 'Reason'
        required: true
        default: 'dev'
      stackName:
        description: 'Stack name if not using default'
        required: false
        default: '-'
      s3BucketName:
        description: 'S3 Bucket if not using default'
        required: false
        default: '-'
      awsRegion:
        required: true
        description: AWS awsRegion
        default: us-west-2
        options:
          - 'us-west-2'
          - 'us-east-2'

env:
  ENVIRONMENT: ${{ github.event.inputs.environment }}
  REASON: ${{ github.event.inputs.reason }}
  AWS_REGION: ${{ github.event.inputs.awsRegion }}
  NEW_STACK_NAME: ${{ github.event.inputs.stackName }}
  S3_BUCKET_NAME: ${{ github.event.inputs.s3BucketName }}
  DEV_ROLE_ARN: arn:aws:iam::210944367560:role/github-actions-oidc
  STAGING_ROLE_ARN: arn:aws:iam::888736119939:role/github-actions-oidc
  PROD_ROLE_ARN: arn:aws:iam::363694354866:role/github-actions-oidc

jobs:
  deploy:
    name: Deploy the full stack to cloudformation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Branch
        uses: actions/checkout@v4

      - name: Set dev AWS role
        if: env.ENVIRONMENT == 'dev' || env.ENVIRONMENT == 'dev-dr' || env.ENVIRONMENT == 'load'
        run: echo "OIDC_ROLE_ARN=${DEV_ROLE_ARN}" >> $GITHUB_ENV

      - name: Set staging AWS role
        if: env.ENVIRONMENT == 'staging'
        run: echo "OIDC_ROLE_ARN=${STAGING_ROLE_ARN}" >> $GITHUB_ENV

      - name: Set prod AWS role
        if: env.ENVIRONMENT == 'prod' || env.ENVIRONMENT == 'prod-dr'
        run: echo "OIDC_ROLE_ARN=${PROD_ROLE_ARN}" >> $GITHUB_ENV

      - name: Install dependencies
        shell: bash
        run: |
          echo -e "Checking for required packages...\n"

          if ! command -v aws &>/dev/null; then
            echo "AWS CLI is not installed on the host. Installing now..."
            sudo apt -qq update
            curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
            unzip awscliv2.zip
            sudo ./aws/install
          fi

      - name: Setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install python dependencies
        uses: py-actions/py-dependency-install@v4
        with:
          path: ".github/workflows/requirements.txt"

      - name: Configure AWS Region
        run: echo "AWS_DEFAULT_REGION=${{ env.AWS_REGION }}" >> $GITHUB_ENV

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve deployment parameters
        shell: bash
        env:
          REASON: ${{ env.REASON }}
          REQUESTED_STACK_NAME: ${{ env.NEW_STACK_NAME }}
          REQUESTED_BUCKET_NAME: ${{ env.S3_BUCKET_NAME }}
        run: |
          # Inputs use '-' as the "not provided" sentinel, so resolve defaults
          # here once and export the result to the check/deploy steps below.
          if [ "$REQUESTED_STACK_NAME" = "-" ]; then
            STACK_NAME="serverlessrepo-pti-${REASON}-image-magick-lambda-layer2"
          else
            STACK_NAME="$REQUESTED_STACK_NAME"
          fi

          if [ "$REQUESTED_BUCKET_NAME" = "-" ]; then
            DEPLOYMENT_BUCKET="pti-${REASON}-cluster-assets-bucket"
          else
            DEPLOYMENT_BUCKET="$REQUESTED_BUCKET_NAME"
          fi

          # These values land in $GITHUB_ENV, so restrict them to the character
          # set AWS itself accepts to keep free-text inputs from injecting
          # newlines or extra assignments into the environment.
          if ! [[ "$DEPLOYMENT_BUCKET" =~ ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$ ]]; then
            echo "::error::Invalid S3 bucket name '$DEPLOYMENT_BUCKET'. Expected 3-63 chars of lowercase letters, digits, hyphens and dots."
            exit 1
          fi

          if ! [[ "$STACK_NAME" =~ ^[A-Za-z][A-Za-z0-9-]{0,127}$ ]]; then
            echo "::error::Invalid CloudFormation stack name '$STACK_NAME'. Expected an alphanumeric start, then alphanumerics and hyphens (max 128 chars)."
            exit 1
          fi

          {
            echo "STACK_NAME=$STACK_NAME"
            echo "DEPLOYMENT_BUCKET=$DEPLOYMENT_BUCKET"
          } >> "$GITHUB_ENV"

          echo "Stack:      $STACK_NAME"
          echo "Bucket:     $DEPLOYMENT_BUCKET"

      - name: Verify deployment bucket
        shell: bash
        run: |
          # Fail in seconds, before the ~6 minute layer build, if the bucket is
          # missing or the OIDC role cannot reach it.
          echo "Checking s3://$DEPLOYMENT_BUCKET ..."
          if ! aws s3api head-bucket --bucket "$DEPLOYMENT_BUCKET"; then
            echo "::error::Bucket '$DEPLOYMENT_BUCKET' does not exist, or role '$OIDC_ROLE_ARN' cannot access it in $AWS_DEFAULT_REGION. Aborting before the layer build."
            exit 1
          fi
          echo "Bucket reachable."

      - name: Run deploy
        shell: bash
        run: |
          make all && make deploy DEPLOYMENT_BUCKET="$DEPLOYMENT_BUCKET" STACK_NAME="$STACK_NAME"

